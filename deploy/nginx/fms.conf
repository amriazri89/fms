# /etc/nginx/sites-available/fms
# The ASP.NET Core app serves both the React app and /api, so Nginx forwards everything to it.
# Nginx serves the hashed /assets/ files directly (faster, long cache).
# Run certbot afterwards to add HTTPS (it edits this file for you).

server {
    listen 80;
    listen [::]:80;
    server_name _;   # server-setup.sh replaces this with your domain

    server_tokens off;
    client_max_body_size 20m;   # claim receipts / uploads

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;   # SAMEORIGIN: print pages may use iframes
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite hashed files: served straight from disk, cached for a year
    location /assets/ {
        root /var/www/fms/current/api/wwwroot;
        expires 1y;
        try_files $uri =404;
    }

    # Everything else (React pages, index.html, /api) -> Kestrel
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # slow reports (P&L, sales report)
    }
}
